<!DOCTYPE html>
<html lang="en" style="background:#7B2B8C;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7B2B8C" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>Budget Bharat</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    html, body {
      min-height: 100%;
      margin: 0;
      background: #7B2B8C;
    }

    #bb-startup-splash-final {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: linear-gradient(45deg, #5B18FE 0%, #7B2B8C 50%, #F45777 100%);
      opacity: 1;
      transition: opacity 220ms ease-out;
    }

    #bb-startup-splash-final img {
      display: block;
      width: min(78vw, 560px);
      max-width: 78vw;
      max-height: 24vh;
      height: auto;
      object-fit: contain;
      animation: bb-splash-logo-settle 700ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
    }

    @keyframes bb-splash-logo-settle {
      from { opacity: 0.72; transform: scale(1.08); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      #bb-startup-splash-final img { animation: none; }
      #bb-startup-splash-final { transition: none; }
    }
  </style>
</head>
<body>
  <div id="root" style="min-height:100vh;min-height:100dvh;background:#7B2B8C;"></div>

  <div id="bb-startup-splash-final" aria-label="Budget Bharat loading">
    <img
      src="/assets/branding/budget-bharat-horizontal-logo.png"
      alt="Budget Bharat"
      fetchpriority="high"
    />
  </div>

  <script>
    (function () {
      var splash = document.getElementById('bb-startup-splash-final');
      var root = document.getElementById('root');
      var logo = splash ? splash.querySelector('img') : null;
      var remove = function () {
        if (!splash || !root || !root.firstElementChild) return;
        // Keep the branded overlay until its local logo has loaded, and keep
        // the WebView's initial blank frame on the same color as native splash.
        if (logo && !logo.complete) return;
        root.style.background = '#F4F3F8';
        splash.style.opacity = '0';
        setTimeout(function () {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 240);
      };
      if (root && window.MutationObserver) {
        new MutationObserver(remove).observe(root, { childList: true, subtree: true });
      }
      window.addEventListener('load', function () { setTimeout(remove, 120); }, { once: true });
    })();
  </script>

  <script type="module" src="/src/nativeExportBridge.js"></script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
