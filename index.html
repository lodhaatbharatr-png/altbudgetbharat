<!DOCTYPE html>
<html lang="en" style="background:#1E104B;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1E104B" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>Budget Bharat</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>#budget-bharat-boot-splash{position:fixed;inset:0;z-index:99999;background:#1E104B;display:flex;align-items:center;justify-content:center;transition:opacity .18s ease}.bb-boot-logo{width:min(62vw,260px);height:auto;object-fit:contain}.bb-boot-hidden{opacity:0;pointer-events:none}</style>
</head>
<body style="margin:0;background:#1E104B;">
  <div id="budget-bharat-boot-splash"><img class="bb-boot-logo" src="/assets/icon.png" alt="Budget Bharat" /></div>
  <div id="root" style="min-height:100vh;background:#F4F3F8;"></div>
  <div id="bb-startup-splash-final" style="position:fixed;inset:0;z-index:2147483647;background:#1E104B;display:flex;align-items:center;justify-content:center;opacity:1;transition:opacity .18s ease-out;">
    <img src="assets/icon.png" alt="Budget Bharat" style="width:118px;height:118px;object-fit:contain;display:block;" />
  </div>
  <script>
    (function () {
      var splash = document.getElementById('bb-startup-splash-final');
      var root = document.getElementById('root');
      var remove = function () {
        if (!splash || !root || !root.firstElementChild) return;
        splash.style.opacity = '0';
        setTimeout(function () { if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }, 220);
      };
      if (root && window.MutationObserver) new MutationObserver(remove).observe(root, { childList: true, subtree: true });
      window.addEventListener('load', function () { setTimeout(remove, 120); }, { once: true });
    })();
  </script>
  <script>window.setTimeout(function(){var s=document.getElementById("budget-bharat-boot-splash");var r=document.getElementById("root");if(s&&r&&r.childElementCount){s.classList.add("bb-boot-hidden");setTimeout(function(){s.remove()},220)}},250);</script>
  <script type="module" src="/src/nativeExportBridge.js"></script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
