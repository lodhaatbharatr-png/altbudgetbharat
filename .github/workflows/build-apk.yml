name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_branch:
        description: 'Branch to build and test'
        required: true
        default: 'main'
        type: string

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_branch || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Apply restore picker fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/main.jsx')
          text = path.read_text(encoding='utf-8')

          old_accept = 'accept=".csv,text/csv"'
          if old_accept in text:
              text = text.replace(old_accept, 'accept="*/*"', 1)

          old_handler = """                  const file = e.target.files && e.target.files[0];
                  e.target.value = '';
                  if (!file) return;
                  if (!window.confirm('Restoring a backup replaces all current data on this device. Continue?')) return;
                  setIsMenuOpen(false);
                  importFullBackupCsv(file);"""
          new_handler = """                  const file = e.target.files && e.target.files[0];
                  e.target.value = '';
                  if (!file) return;
                  const fileName = String(file.name || '').toLowerCase();
                  const fileType = String(file.type || '').toLowerCase();
                  if (!fileName.endsWith('.csv') && fileType !== 'text/csv' && fileType !== 'application/csv') {
                    showFeedback('Please select a Budget Bharat CSV backup file.');
                    return;
                  }
                  if (!window.confirm('Restoring a backup replaces all current data on this device. Continue?')) return;
                  setIsMenuOpen(false);
                  importFullBackupCsv(file);"""
          if old_handler in text:
              text = text.replace(old_handler, new_handler, 1)

          path.write_text(text, encoding='utf-8')
          print('Restore picker fix applied in build workspace.')
          PY

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Prepare Capacitor Android Platform
        shell: bash
        run: |
          if [ -f android/gradlew ]; then
            echo 'Existing Android platform is complete; syncing it.'
          elif [ -d android ]; then
            echo 'Android directory exists but is incomplete; recreating the native platform.'
            rm -rf android
            npx cap add android
          else
            echo 'Android platform is missing; adding it.'
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Report DEBUG signing SHA-1
        shell: bash
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            echo "DEBUG keystore was not created at $KEYSTORE"
            exit 1
          fi
          echo 'DEBUG signing certificate:'
          keytool -list -v \
            -keystore "$KEYSTORE" \
            -alias AndroidDebugKey \
            -storepass android \
            -keypass android | grep -E 'Owner:|SHA1:|SHA-1:'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: budget-bharat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
