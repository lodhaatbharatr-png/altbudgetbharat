name: Build APK

on:
  push:
    branches:
      - main
      - fix/native-exports-backup-sync-ci
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Apply requested source fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('src/main.jsx')
          text = p.read_text(encoding='utf-8')

          text, n = re.subn(r"const LoadingScreen = \(\) => \(.*?\n\);", "const LoadingScreen = () => null;", text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('LoadingScreen not found')
          text, n = re.subn(r"\n  if \(loading && transactions\.length === 0 && persons\.length === 0\) \{\n    return <div className=\"app-shell\"><LoadingScreen \/><\/div>;\n  \}\n", "\n", text, count=1)
          if n != 1:
              raise SystemExit('LoadingScreen early return not found')

          person_new = '''  const handleWhatsAppShare = async () => {
    const actionWord = person.remaining > 0 ? 'you will pay' : person.remaining < 0 ? 'you will receive' : 'is settled at';
    const textMsg = `Dear ${person.name}, ${actionWord} ${formatMoney(Math.abs(person.remaining))} on or before date ${targetDateStr}.`;
    try {
      showFeedback('Preparing WhatsApp reminder...');
      const reminderFile = await createPaymentReminderImage({
        personName: person.name,
        amount: Math.abs(person.remaining),
        dueDate: targetDateStr,
        loanName: 'Ledger Payment Reminder',
        emiNo: null,
        admin
      });
      if (!navigator.canShare || !navigator.canShare({ files: [reminderFile] })) {
        throw new Error('This device cannot share an image and caption together.');
      }
      await navigator.share({ files: [reminderFile], title: 'Budget Bharat Payment Reminder', text: textMsg });
      showFeedback('Reminder ready to share');
    } catch (err) {
      if (err && err.name === 'AbortError') { showFeedback('Reminder share canceled'); return; }
      console.error('Person reminder share error:', err);
      showFeedback('Reminder failed: ' + (err?.message || 'image generation failed'));
    }
  };'''
          text, n = re.subn(r"  const handleWhatsAppShare = \(\) => \{.*?\n  \};", person_new, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Person WhatsApp handler not found')

          loan_new = '''  const handleSendWhatsAppReminder = async () => {
    if (!currentLoan) return;
    const nextPending = currentLoan.schedule.find(s => !s.paid);
    if (!nextPending) {
      showFeedback('All EMIs for this loan are cleared!');
      return;
    }
    try {
      showFeedback('Preparing EMI reminder...');
      const reminderFile = await createPaymentReminderImage({
        personName: currentLoan.person,
        amount: nextPending.emiAmount,
        dueDate: nextPending.date,
        loanName: currentLoan.loanName,
        emiNo: nextPending.emiNo,
        admin
      });
      const caption = `Dear ${currentLoan.person}, your ${currentLoan.loanName} EMI #${nextPending.emiNo} of ${formatMoney(nextPending.emiAmount)} is due on ${formatDisplayDate(nextPending.date)}.`;
      if (!navigator.canShare || !navigator.canShare({ files: [reminderFile] })) {
        throw new Error('This device cannot share an image and caption together.');
      }
      await navigator.share({ files: [reminderFile], title: 'Budget Bharat EMI Reminder', text: caption });
      showFeedback('Reminder ready to share');
    } catch (err) {
      if (err && err.name === 'AbortError') { showFeedback('Reminder share canceled'); return; }
      console.error('Payment reminder image error:', err);
      showFeedback('Reminder failed: ' + (err?.message || 'image generation failed'));
    }
  };'''
          text, n = re.subn(r"  const handleSendWhatsAppReminder = async \(\) => \{.*?\n  \};", loan_new, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Loan WhatsApp handler not found')

          if 'window.__BUDGET_BHARAT_NEW_CATEGORY_TYPE__ = categoryType;' not in text:
              raise SystemExit('Income/expense category handoff missing')
          p.write_text(text, encoding='utf-8')

          css_path = Path('src/index.css')
          css = css_path.read_text(encoding='utf-8')
          export_css = '''\n/* Export slips: compact, vertically centered cells and natural-ratio images. */\n.canvas-hide table { border-collapse: collapse !important; }\n.canvas-hide th,\n.canvas-hide td { vertical-align: middle !important; padding-top: 4px !important; padding-bottom: 4px !important; }\n.canvas-hide img { height: auto !important; max-height: none !important; object-fit: contain !important; }\n'''
          if '.canvas-hide th' not in css:
              css += export_css
              css_path.write_text(css, encoding='utf-8')

          gp = Path('src/googleSync.js')
          g = gp.read_text(encoding='utf-8')
          if 'GoogleAuth.initialize();' not in g:
              g = g.replace("  login: async function () {\n    try {", "  login: async function () {\n    try {\n      try { GoogleAuth.initialize(); } catch (_) {}", 1)
          g = g.replace("    } catch (err) {\n      throw this._normalizeError(err, 'Sign-in canceled or failed.');\n    }\n  },", "    } catch (err) {\n      const code = String(err?.code ?? err?.statusCode ?? err?.errorCode ?? '');\n      if (code === '10' || String(err?.message || '').toLowerCase().includes('something went wrong')) {\n        throw new Error('Google sign-in developer configuration error (code 10). The installed Android APK must be signed with a SHA-1 registered on the Android OAuth client for com.bharatrasve.budgetbharat.');\n      }\n      throw this._normalizeError(err, 'Sign-in canceled or failed.');\n    }\n  },", 1)
          gp.write_text(g, encoding='utf-8')
          PY

          echo 'Requested source fixes applied in the build workspace.'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Commit requested source fixes on branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/native-exports-backup-sync-ci'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/index.css src/googleSync.js
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m "fix: finalize sharing exports startup and google auth"
            git push
          fi

      - name: Prepare complete Capacitor Android project
        shell: bash
        run: |
          if [ ! -f android/gradlew ]; then
            echo 'Committed Android project is incomplete; generating the missing Capacitor Android wrapper.'
            mkdir -p /tmp/budget-bharat-android-backup
            if [ -f android/app/build.gradle ]; then
              cp android/app/build.gradle /tmp/budget-bharat-android-backup/build.gradle
            fi
            rm -rf android
            npx cap add android
            if [ -f /tmp/budget-bharat-android-backup/build.gradle ]; then
              cp /tmp/budget-bharat-android-backup/build.gradle android/app/build.gradle
            fi
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Generate Android launcher icon
        shell: bash
        run: |
          if [ -f assets/icon.png ]; then
            npx @capacitor/assets generate --android
          elif [ -f assets/icon.PNG ]; then
            cp assets/icon.PNG assets/icon.png
            npx @capacitor/assets generate --android
          else
            echo 'No assets/icon.png or assets/icon.PNG found; keeping any committed launcher assets.'
          fi

      - name: Sync generated Android assets
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Report DEBUG signing SHA-1
        shell: bash
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            echo "DEBUG keystore was not created at $KEYSTORE"
            exit 1
          fi
          echo 'DEBUG signing certificate:'
          keytool -list -v \
            -keystore "$KEYSTORE" \
            -alias AndroidDebugKey \
            -storepass android \
            -keypass android | grep -E 'Owner:|SHA1:|SHA-1:'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: budget-bharat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
