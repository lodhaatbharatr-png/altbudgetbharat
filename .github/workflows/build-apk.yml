name: Build APK

on:
  push:
    branches:
      - main
      - fix/native-exports-backup-sync-ci
      - feature/search-contact-picker
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_branch:
        description: Branch to build and test
        required: true
        default: fix/native-exports-backup-sync-ci
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_branch || (github.event_name == 'pull_request' && github.head_ref) || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Apply stabilization source fixes
        run: python3 scripts/ci-stabilize.py

      - name: Apply Phase 1 final polish
        run: python3 scripts/ci-phase1-final-polish.py

      - name: Apply Phase 2 UX polish
        run: |
          python3 scripts/ci-phase2-ux-polish.py || echo "Phase 2 UX polish made no applicable changes; continuing with remaining build phases."

      - name: Normalize Phase 2 finalization rules
        run: python3 scripts/ci-phase2-compat.py

      - name: Apply Phase 2 finalization
        run: python3 scripts/ci-phase2-finalize.py

      - name: Remove retired device contact picker
        run: python3 scripts/ci-remove-device-contacts.py

      - name: Commit stabilization source fixes
        if: github.event_name == 'push' && (github.ref == 'refs/heads/fix/native-exports-backup-sync-ci' || github.ref == 'refs/heads/feature/search-contact-picker')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "fix: remove retired contacts and finalize app startup"
            git push
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Prepare complete Capacitor Android project
        run: |
          if [ ! -f android/gradlew ]; then
            echo "Committed Android project is incomplete; generating the missing Capacitor Android wrapper."
            mkdir -p /tmp/budget-bharat-android-backup
            if [ -f android/app/build.gradle ]; then
              cp android/app/build.gradle /tmp/budget-bharat-android-backup/build.gradle
            fi
            rm -rf android
            npx cap add android
            if [ -f /tmp/budget-bharat-android-backup/build.gradle ]; then
              cp /tmp/budget-bharat-android-backup/build.gradle android/app/build.gradle
            fi
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Remove duplicate Capacitor launch splash
        run: |
          STYLE="android/app/src/main/res/values/styles.xml"
          if [ ! -f "$STYLE" ]; then
            echo "Generated Android styles.xml not found at $STYLE"
            exit 1
          fi
          python3 - "$STYLE" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')
          old = s
          s = re.sub(
              r'(<style\s+name="AppTheme\.NoActionBarLaunch"\s+)parent="Theme\.SplashScreen"',
              r'\1parent="AppTheme.NoActionBar"',
              s,
              count=1,
          )
          s = re.sub(
              r'\n\s*<item\s+name="android:background">@drawable/splash</item>',
              '',
              s,
              count=1,
          )
          if s == old:
              print('Launch splash theme already normalized or not present.')
          else:
              p.write_text(s, encoding='utf-8')
              print('Removed Capacitor launch splash overlay; Android OS splash may still briefly appear on Android 12+.')
          PY

      - name: Generate Android launcher icon
        run: |
          if [ -f assets/icon.png ]; then
            npx @capacitor/assets generate --android
          elif [ -f assets/icon.PNG ]; then
            cp assets/icon.PNG assets/icon.png
            npx @capacitor/assets generate --android
          else
            echo "No icon source found; keeping committed launcher assets."
          fi

      - name: Sync generated Android assets
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Report DEBUG signing SHA-1
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            echo "DEBUG keystore was not created at $KEYSTORE"
            exit 1
          fi
          keytool -list -v \
            -keystore "$KEYSTORE" \
            -alias AndroidDebugKey \
            -storepass android \
            -keypass android | grep -E 'Owner:|SHA1:|SHA-1:'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: budget-bharat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14