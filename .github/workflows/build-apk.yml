name: Build APK

on:
  push:
    branches:
      - main
      - fix/native-exports-backup-sync-ci
      - feature/search-contact-picker
      - fix/android-launcher-splash-background
      - fix/android-system-bars-full-height
  pull_request:
    branches:
      - main
      - feature/search-contact-picker
  workflow_dispatch:
    inputs:
      build_branch:
        description: Branch to build and test
        required: true
        default: fix/native-exports-backup-sync-ci
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_branch || (github.event_name == 'pull_request' && github.head_ref) || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Apply stabilization source fixes
        run: python3 scripts/ci-stabilize.py

      - name: Apply Phase 1 final polish
        run: python3 scripts/ci-phase1-final-polish.py

      - name: Apply Phase 2 UX polish
        run: |
          set +e
          python3 scripts/ci-phase2-ux-polish.py
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Phase 2 UX polish reported no applicable footer transformation; continuing with remaining build phases."
          else
            echo "Phase 2 UX polish completed."
          fi
          exit 0



      - name: Apply Phase 2 finalization
        run: python3 scripts/ci-phase2-finalize.py

      - name: Verify retired device contacts are absent
        run: python3 scripts/ci-remove-device-contacts.py

      - name: Commit stabilization source fixes
        if: github.event_name == 'push' && (github.ref == 'refs/heads/fix/native-exports-backup-sync-ci' || github.ref == 'refs/heads/feature/search-contact-picker')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "fix: remove retired contacts and finalize app startup"
            git push
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare branded splash images for the web build
        run: |
          # The uploaded brand kit is the source of truth for launcher layers.
          # Refresh the compatibility paths used by the existing build steps so
          # the native splash and adaptive launcher always use the same artwork.
          if [ -f brand-kit/source/ic_launcher_foreground_1024.png ] && [ -f brand-kit/source/ic_launcher_background_1024.png ]; then
            cp brand-kit/source/ic_launcher_foreground_1024.png assets/ic_launcher_foreground.png
            cp brand-kit/source/ic_launcher_background_1024.png assets/ic_launcher_background.png
            echo "Using the canonical 1024px launcher layers from brand-kit/source."
          else
            echo "Brand-kit launcher layers not found; using the existing assets/ launcher layers."
          fi
          mkdir -p public/assets
          cp assets/ic_launcher_foreground.png public/assets/ic_launcher_foreground.png
          cp assets/ic_launcher_background.png public/assets/ic_launcher_background.png

      - name: Normalize adaptive launcher background
        run: |
          python3 -m venv /tmp/budget-bharat-image-tools
          /tmp/budget-bharat-image-tools/bin/pip install --quiet Pillow
          /tmp/budget-bharat-image-tools/bin/python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          path = Path("assets/ic_launcher_background.png")
          image = Image.open(path).convert("RGBA")
          alpha = image.getchannel("A")
          if alpha.getextrema()[0] < 255:
              width, height = image.size
              gradient = Image.new("RGB", (width, height))
              draw = ImageDraw.Draw(gradient)
              stops = [
                  (0.0, (91, 24, 254)),
                  (0.5, (123, 43, 140)),
                  (1.0, (244, 87, 119)),
              ]
              for x in range(width):
                  t = x / max(1, width - 1)
                  for index in range(len(stops) - 1):
                      if stops[index][0] <= t <= stops[index + 1][0]:
                          left_t, left = stops[index]
                          right_t, right = stops[index + 1]
                          amount = (t - left_t) / (right_t - left_t)
                          color = tuple(
                              round(left[c] + (right[c] - left[c]) * amount)
                              for c in range(3)
                          )
                          break
                  draw.line((x, 0, x, height - 1), fill=color)
              image = Image.alpha_composite(gradient.convert("RGBA"), image)
              image.save(path)
              print("Filled transparent launcher-background pixels with the brand gradient.")
          else:
              print("Launcher background is already fully opaque.")
          PY
          cp assets/ic_launcher_background.png public/assets/ic_launcher_background.png

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Prepare complete Capacitor Android project
        run: |
          if [ ! -f android/gradlew ]; then
            echo "Committed Android project is incomplete; generating the missing Capacitor Android wrapper."
            mkdir -p /tmp/budget-bharat-android-backup
            if [ -f android/app/build.gradle ]; then
              cp android/app/build.gradle /tmp/budget-bharat-android-backup/build.gradle
            fi
            rm -rf android
            npx cap add android
            if [ -f /tmp/budget-bharat-android-backup/build.gradle ]; then
              cp /tmp/budget-bharat-android-backup/build.gradle android/app/build.gradle
            fi
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Generate Android launcher icon
        run: |
          if [ -f assets/ic_launcher_foreground.png ] && [ -f assets/ic_launcher_background.png ]; then
            echo "Preparing Claude's foreground/background assets for Capacitor Assets."
            cp assets/ic_launcher_foreground.png assets/icon-foreground.png
            cp assets/ic_launcher_background.png assets/icon-background.png
            npx @capacitor/assets generate --android
          elif [ -f assets/icon-foreground.png ] && [ -f assets/icon-background.png ]; then
            echo "Generating adaptive launcher icon from separate foreground/background assets."
            npx @capacitor/assets generate --android
          elif [ -f assets/icon.png ]; then
            echo "Separate adaptive icon layers are not present yet; using the existing combined icon."
            npx @capacitor/assets generate --android
          elif [ -f assets/icon.PNG ]; then
            cp assets/icon.PNG assets/icon.png
            npx @capacitor/assets generate --android
          else
            echo "No icon source found; keeping committed launcher assets."
          fi

      - name: Sync generated Android assets
        run: npx cap sync android

      - name: Configure branded native Android splash and window background
        run: |
          /tmp/budget-bharat-image-tools/bin/python <<'PY'
          from pathlib import Path
          from PIL import Image
          import re
          import shutil

          root = Path("android/app/src/main/res")
          color_name = "budget_bharat_window_background"
          # Android's system splash background is a solid color; use the existing
          # Budget Bharat Velvet Orchid brand color, then transition to the full gradient HTML splash.
          color_xml = f'<color name="{color_name}">#7B2B8C</color>'

          values = root / "values"
          values.mkdir(parents=True, exist_ok=True)
          colors = values / "colors.xml"
          if colors.exists():
              content = colors.read_text(encoding="utf-8")
              pattern = rf'<color\s+name="{color_name}">.*?</color>'
              if re.search(pattern, content):
                  content = re.sub(pattern, color_xml, content, count=1)
              else:
                  content = content.replace("</resources>", f"    {color_xml}\n</resources>")
          else:
              content = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    ' + color_xml + '\n</resources>\n'
          colors.write_text(content, encoding="utf-8")

          # System bars are separate native surfaces. Use the brand plum for
          # the status bar and the app canvas color for the navigation area.
          system_bar_colors = {
              "budget_bharat_status_bar": "#7B2B8C",
              "budget_bharat_navigation_bar": "#F4F3F8",
          }
          for system_color_name, system_color_value in system_bar_colors.items():
              system_color_xml = f'<color name="{system_color_name}">{system_color_value}</color>'
              current_colors = colors.read_text(encoding="utf-8")
              system_pattern = rf'<color\s+name="{system_color_name}">.*?</color>'
              if re.search(system_pattern, current_colors):
                  current_colors = re.sub(system_pattern, system_color_xml, current_colors, count=1)
              else:
                  current_colors = current_colors.replace("</resources>", f"    {system_color_xml}\n</resources>")
              colors.write_text(current_colors, encoding="utf-8")

          # Keep the Android 12 system splash visually quiet: the HTML splash is
          # the only branded logo screen. Android requires a system splash on
          # modern Android, so use a fully transparent icon and a matching brand
          # background rather than showing a cropped/duplicated monogram.
          splash_drawable_dir = root / "drawable-nodpi"
          splash_drawable_dir.mkdir(parents=True, exist_ok=True)
          transparent_icon = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          transparent_icon.save(splash_drawable_dir / "budget_bharat_splash_icon_bitmap.png")

          # Reference the PNG drawable directly. This is the most compatible
          # resource form for Android 12's windowSplashScreenAnimatedIcon.

          def set_item(body, name, value):
              pattern = rf'<item\s+name="{re.escape(name)}">.*?</item>'
              replacement = f'<item name="{name}">{value}</item>'
              if re.search(pattern, body, flags=re.S):
                  return re.sub(pattern, replacement, body, count=1, flags=re.S)
              return body.rstrip() + f'\n        {replacement}\n      '

          launch_style_found = False
          for style_file in root.glob("values*/styles.xml"):
              content = style_file.read_text(encoding="utf-8")
              for style_name in ("AppTheme.NoActionBar", "AppTheme.NoActionBarLaunch"):
                  match = re.search(
                      rf'(<style\s+name="{re.escape(style_name)}"[^>]*>)(.*?)(</style>)',
                      content,
                      flags=re.S,
                  )
                  if not match:
                      continue
                  opening, body, closing = match.groups()

                  if style_name == "AppTheme.NoActionBarLaunch":
                      launch_style_found = True
                      # Keep Android's required system splash, but remove the old
                      # Capacitor splash drawable and specify the transparent glyph.
                      opening = re.sub(r'\s+parent="[^"]+"', ' parent="Theme.SplashScreen"', opening, count=1)
                      body = re.sub(r'<item\s+name="android:background">.*?</item>', '', body, count=1, flags=re.S)
                      body = set_item(body, "windowSplashScreenBackground", f"@color/{color_name}")
                      body = set_item(body, "windowSplashScreenAnimatedIcon", "@drawable/budget_bharat_splash_icon_bitmap")
                      body = set_item(body, "postSplashScreenTheme", "@style/AppTheme.NoActionBar")
                  else:
                      body = set_item(body, "android:windowBackground", f"@color/{color_name}")
                      body = set_item(body, "android:colorBackground", f"@color/{color_name}")

                  # Keep status/navigation bars integrated with the app instead
                  # of Android's default black/gray surfaces. Status icons stay
                  # light on plum; navigation icons stay dark on the light canvas.
                  body = set_item(body, "android:windowDrawsSystemBarBackgrounds", "true")
                  body = set_item(body, "android:statusBarColor", "@color/budget_bharat_status_bar")
                  body = set_item(body, "android:windowLightStatusBar", "false")
                  body = set_item(body, "android:navigationBarColor", "@color/budget_bharat_navigation_bar")
                  body = set_item(body, "android:windowLightNavigationBar", "true")
                  body = set_item(body, "android:enforceStatusBarContrast", "false")
                  body = set_item(body, "android:enforceNavigationBarContrast", "false")

                  content = content[:match.start()] + opening + body + closing + content[match.end():]
              style_file.write_text(content, encoding="utf-8")

          if not launch_style_found:
              raise SystemExit(
                  "Could not find AppTheme.NoActionBarLaunch in generated Android styles; "
                  "refusing to build an APK with a background-only native splash."
              )

          configured_styles = [
              p.read_text(encoding="utf-8")
              for p in root.glob("values*/styles.xml")
          ]
          if not any(
              'name="windowSplashScreenAnimatedIcon"' in styles
              and "@drawable/budget_bharat_splash_icon_bitmap" in styles
              for styles in configured_styles
          ):
              raise SystemExit(
                  "Native splash icon reference was not written to Android styles; "
                  "refusing to build a background-only splash."
              )

          splash_bitmap = splash_drawable_dir / "budget_bharat_splash_icon_bitmap.png"
          if not splash_bitmap.is_file():
              raise SystemExit("Native splash PNG drawable was not generated.")

          # Capacitor's generated MainActivity must install AndroidX SplashScreen
          # before super.onCreate so postSplashScreenTheme is applied correctly.
          main_activity = Path("android/app/src/main/java/com/bharatrasve/budgetbharat/MainActivity.java")
          main_activity.parent.mkdir(parents=True, exist_ok=True)
          main_activity.write_text(
              "package com.bharatrasve.budgetbharat;\n\n"
              "import android.os.Bundle;\n"
              "import androidx.core.splashscreen.SplashScreen;\n"
              "import com.getcapacitor.BridgeActivity;\n\n"
              "public class MainActivity extends BridgeActivity {\n"
              "    @Override\n"
              "    public void onCreate(Bundle savedInstanceState) {\n"
              "        SplashScreen.installSplashScreen(this);\n"
              "        super.onCreate(savedInstanceState);\n"
              "    }\n"
              "}\n",
              encoding="utf-8",
          )

          print("Verified transparent native splash icon, matching #7B2B8C native/window background, AndroidX splash installation, and the full-gradient HTML splash.")
          PY

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Report DEBUG signing SHA-1
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            echo "DEBUG keystore was not created at $KEYSTORE"
            exit 1
          fi
          keytool -list -v \
            -keystore "$KEYSTORE" \
            -alias AndroidDebugKey \
            -storepass android \
            -keypass android | grep -E 'Owner:|SHA1:|SHA-1:'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: budget-bharat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14