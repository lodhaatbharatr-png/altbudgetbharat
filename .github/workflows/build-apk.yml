name: Build APK

on:
  push:
    branches:
      - main
      - fix/native-exports-backup-sync-ci
      - feature/search-contact-picker
      - fix/android-launcher-splash-background
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_branch:
        description: Branch to build and test
        required: true
        default: fix/native-exports-backup-sync-ci
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_branch || (github.event_name == 'pull_request' && github.head_ref) || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Apply stabilization source fixes
        run: python3 scripts/ci-stabilize.py

      - name: Apply Phase 1 final polish
        run: python3 scripts/ci-phase1-final-polish.py

      - name: Apply Phase 2 UX polish
        run: |
          set +e
          python3 scripts/ci-phase2-ux-polish.py
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Phase 2 UX polish reported no applicable footer transformation; continuing with remaining build phases."
          else
            echo "Phase 2 UX polish completed."
          fi
          exit 0



      - name: Apply Phase 2 finalization
        run: python3 scripts/ci-phase2-finalize.py

      - name: Verify retired device contacts are absent
        run: python3 scripts/ci-remove-device-contacts.py

      - name: Commit stabilization source fixes
        if: github.event_name == 'push' && (github.ref == 'refs/heads/fix/native-exports-backup-sync-ci' || github.ref == 'refs/heads/feature/search-contact-picker')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "fix: remove retired contacts and finalize app startup"
            git push
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Prepare complete Capacitor Android project
        run: |
          if [ ! -f android/gradlew ]; then
            echo "Committed Android project is incomplete; generating the missing Capacitor Android wrapper."
            mkdir -p /tmp/budget-bharat-android-backup
            if [ -f android/app/build.gradle ]; then
              cp android/app/build.gradle /tmp/budget-bharat-android-backup/build.gradle
            fi
            rm -rf android
            npx cap add android
            if [ -f /tmp/budget-bharat-android-backup/build.gradle ]; then
              cp /tmp/budget-bharat-android-backup/build.gradle android/app/build.gradle
            fi
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Remove duplicate Capacitor launch splash
        run: |
          STYLE="android/app/src/main/res/values/styles.xml"
          if [ ! -f "$STYLE" ]; then
            echo "Generated Android styles.xml not found at $STYLE"
            exit 1
          fi
          python3 - "$STYLE" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')
          old = s
          s = re.sub(
              r'(<style\s+name="AppTheme\.NoActionBarLaunch"\s+)parent="Theme\.SplashScreen"',
              r'\1parent="AppTheme.NoActionBar"',
              s,
              count=1,
          )
          s = re.sub(
              r'\n\s*<item\s+name="android:background">@drawable/splash</item>',
              '',
              s,
              count=1,
          )
          if s == old:
              print('Launch splash theme already normalized or not present.')
          else:
              p.write_text(s, encoding='utf-8')
              print('Removed Capacitor launch splash overlay; Android OS splash may still briefly appear on Android 12+.')
          PY

      - name: Generate Android launcher icon
        run: |
          if [ -f assets/icon-foreground.png ] && [ -f assets/icon-background.png ]; then
            echo "Generating adaptive launcher icon from separate foreground/background assets."
            npx @capacitor/assets generate --android
          elif [ -f assets/icon.png ]; then
            echo "Separate adaptive icon layers are not present yet; using the existing combined icon."
            npx @capacitor/assets generate --android
          elif [ -f assets/icon.PNG ]; then
            cp assets/icon.PNG assets/icon.png
            npx @capacitor/assets generate --android
          else
            echo "No icon source found; keeping committed launcher assets."
          fi

      - name: Sync generated Android assets
        run: npx cap sync android

      - name: Set native Android startup/window background
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("android/app/src/main/res")
          values = root / "values"
          values.mkdir(parents=True, exist_ok=True)
          colors = values / "colors.xml"
          color_name = "budget_bharat_window_background"
          color_xml = '<color name="budget_bharat_window_background">#1E104B</color>'

          if colors.exists():
              content = colors.read_text(encoding="utf-8")
              pattern = rf'<color\s+name="{color_name}">.*?</color>'
              if re.search(pattern, content):
                  content = re.sub(pattern, color_xml, content, count=1)
              else:
                  content = content.replace("</resources>", f"    {color_xml}\n</resources>")
          else:
              content = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    ' + color_xml + '\n</resources>\n'
          colors.write_text(content, encoding="utf-8")

          # Keep the native window dark while Android is starting or the WebView
          # is being recreated. The app's actual React root remains light.
          for style_file in root.glob("values*/styles.xml"):
              content = style_file.read_text(encoding="utf-8")
              for style_name in ("AppTheme.NoActionBar", "AppTheme.NoActionBarLaunch"):
                  match = re.search(
                      rf'(<style\s+name="{re.escape(style_name)}"[^>]*>)(.*?)(</style>)',
                      content,
                      flags=re.S,
                  )
                  if not match:
                      continue
                  opening, body, closing = match.groups()
                  for item_name in ("android:windowBackground", "android:colorBackground"):
                      item = rf'<item\s+name="{item_name}">.*?</item>'
                      body = re.sub(item, "", body, count=1)
                  body = body.rstrip() + (
                      '\n        <item name="android:windowBackground">@color/budget_bharat_window_background</item>'
                      '\n        <item name="android:colorBackground">@color/budget_bharat_window_background</item>\n      '
                  )
                  content = content[:match.start()] + opening + body + closing + content[match.end():]

              # Android 12+ uses this attribute when a SplashScreen theme is present.
              if "values-v31" in str(style_file.parent) and "windowSplashScreenBackground" in content:
                  content = re.sub(
                      r'<item\s+name="windowSplashScreenBackground">.*?</item>',
                      '<item name="windowSplashScreenBackground">@color/budget_bharat_window_background</item>',
                      content,
                      count=1,
                  )
              style_file.write_text(content, encoding="utf-8")
          print("Configured #1E104B as the native Android window/startup background.")
          PY

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Report DEBUG signing SHA-1
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            echo "DEBUG keystore was not created at $KEYSTORE"
            exit 1
          fi
          keytool -list -v \
            -keystore "$KEYSTORE" \
            -alias AndroidDebugKey \
            -storepass android \
            -keypass android | grep -E 'Owner:|SHA1:|SHA-1:'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: budget-bharat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14