name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Generate Android launcher icon
        shell: bash
        run: |
          if [ -f assets/icon.png ]; then
            npx @capacitor/assets generate --android
          elif [ -f assets/icon.PNG ]; then
            cp assets/icon.PNG assets/icon.png
            npx @capacitor/assets generate --android
          else
            echo 'No assets/icon.png or assets/icon.PNG found; keeping any committed launcher assets.'
          fi

      - name: Prepare complete Capacitor Android project
        shell: bash
        run: |
          if [ ! -f android/gradlew ]; then
            echo 'Committed Android project is incomplete; generating the missing Capacitor Android wrapper.'
            mkdir -p /tmp/budget-bharat-android-backup
            if [ -f android/app/build.gradle ]; then
              cp android/app/build.gradle /tmp/budget-bharat-android-backup/build.gradle
            fi
            rm -rf android
            npx cap add android
            if [ -f /tmp/budget-bharat-android-backup/build.gradle ]; then
              cp /tmp/budget-bharat-android-backup/build.gradle android/app/build.gradle
            fi
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Report DEBUG signing SHA-1
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew signingReport

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: budget-bharat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
