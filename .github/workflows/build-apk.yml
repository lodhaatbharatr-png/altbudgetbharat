name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Generate Android launcher icon from assets/icon.PNG
        shell: bash
        run: |
          if [ -f assets/icon.PNG ]; then
            cp assets/icon.PNG assets/icon.png
            npx @capacitor/assets generate --android
          else
            echo 'assets/icon.PNG is not present in this branch; keeping committed Android launcher assets.'
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: budget-bharat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
