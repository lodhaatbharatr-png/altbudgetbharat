name: Apply device test fixes

on:
  push:
    branches:
      - fix/native-exports-backup-sync-ci

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[device-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-exports-backup-sync-ci
      - name: Apply patch script
        run: python3 scripts/apply_device_fixes.py
      - name: Build check
        run: |
          npm install --legacy-peer-deps
          npm run build
      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx src/index.css
          git rm scripts/apply_device_fixes.py .github/workflows/apply-device-fixes.yml
          git commit -m 'fix: device UI, sharing, and reminder flows [device-fix]'
          git push origin HEAD:fix/native-exports-backup-sync-ci
