name: Apply final app fixes

on:
  push:
    branches:
      - fix/native-exports-backup-sync-ci

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'fix: final app fixes') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch final app behavior
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/main.jsx')
          text = p.read_text(encoding='utf-8')

          # 1) Remove the in-app logo/loading screen. Native launcher/splash handles launch;
          # once the React app mounts, show the actual UI without another branded screen.
          loader = re.compile(r"const LoadingScreen = \(\) => \(.*?\n\);\n", re.S)
          replacement = "const LoadingScreen = () => null;\n"
          text, n = loader.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit('LoadingScreen block not found')

          # 2) New Record -> + Category should inherit the current record type.
          old = """  const openAddMenu = (targetView) => {\n    onClose();\n    setMenuView(targetView);\n    setIsMenuOpen(true);\n  };"""
          new = """  const openAddMenu = (targetView) => {\n    onClose();\n    if (targetView === 'addCategory') {\n      setCatType(type === 'INCOME' ? 'income' : 'expense');\n    }\n    setMenuView(targetView);\n    setIsMenuOpen(true);\n  };"""
          if old not in text:
              raise SystemExit('openAddMenu block not found')
          text = text.replace(old, new, 1)

          # 3) Person Ledger WhatsApp: always use the compact reminder image + caption
          # in one native share action, never PDF/row-count branching.
          person_old = re.compile(r"  const handleWhatsAppShare = \(\) => \{.*?\n  \};", re.S)
          person_new = '''  const handleWhatsAppShare = async () => {
    const actionWord = person.remaining > 0 ? 'you will pay' : person.remaining < 0 ? 'you will receive' : 'is settled at';
    const textMsg = `Dear ${person.name}, ${actionWord} ${formatMoney(Math.abs(person.remaining))} on or before date ${targetDateStr}.`;
    try {
      showFeedback('Preparing WhatsApp reminder...');
      const reminderFile = await createPaymentReminderImage({
        personName: person.name,
        amount: Math.abs(person.remaining),
        dueDate: targetDateStr,
        loanName: 'Ledger Payment Reminder',
        emiNo: null,
        admin
      });
      if (navigator.canShare && navigator.canShare({ files: [reminderFile] })) {
        await navigator.share({ files: [reminderFile], title: 'Budget Bharat Payment Reminder', text: textMsg });
        showFeedback('Reminder ready to share');
        return;
      }
      let phone = String(person.phone || '').replace(/\\D/g, '');
      if (phone.startsWith('0')) phone = phone.replace(/^0+/, '');
      if (phone.length === 10) phone = '91' + phone;
      const waUrl = phone ? `https://wa.me/${phone}?text=${encodeURIComponent(textMsg)}` : `https://api.whatsapp.com/send?text=${encodeURIComponent(textMsg)}`;
      window.open(waUrl, '_blank', 'noopener,noreferrer');
      const url = URL.createObjectURL(reminderFile);
      const link = document.createElement('a'); link.href = url; link.download = reminderFile.name; document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url);
      showFeedback('Reminder image saved and WhatsApp opened');
    } catch (err) {
      if (err && err.name === 'AbortError') { showFeedback('Reminder share canceled'); return; }
      console.error('Person reminder share error:', err);
      showFeedback('Reminder failed: ' + (err?.message || 'image generation failed'));
    }
  };'''
          text, n = person_old.subn(person_new, text, count=1)
          if n != 1:
              raise SystemExit('Person WhatsApp handler not found')

          # 4) Loan WhatsApp: always use the same compact reminder image + caption.
          loan_old = re.compile(r"  const handleSendWhatsAppReminder = \(\) => \{.*?\n  \};", re.S)
          loan_new = '''  const handleSendWhatsAppReminder = async () => {
    if (!currentLoan) return;
    const nextPending = currentLoan.schedule.find(s => !s.paid);
    if (!nextPending) {
      showFeedback('All EMIs for this loan are cleared!');
      return;
    }
    const textMsg = `Hello ${currentLoan.person}, your ${currentLoan.loanName} EMI #${nextPending.emiNo} with amount ${formatMoney(nextPending.emiAmount)} is due on ${nextPending.date} please pay.`;
    try {
      showFeedback('Preparing EMI reminder...');
      const reminderFile = await createPaymentReminderImage({
        personName: currentLoan.person,
        amount: nextPending.emiAmount,
        dueDate: nextPending.date,
        loanName: currentLoan.loanName,
        emiNo: nextPending.emiNo,
        admin
      });
      if (navigator.canShare && navigator.canShare({ files: [reminderFile] })) {
        await navigator.share({ files: [reminderFile], title: 'Budget Bharat EMI Reminder', text: textMsg });
        showFeedback('EMI reminder ready to share');
        return;
      }
      const phoneRaw = borrowerPersonObj ? borrowerPersonObj.phone : '';
      let phone = String(phoneRaw || '').replace(/\\D/g, '');
      if (phone.startsWith('0')) phone = phone.replace(/^0+/, '');
      if (phone.length === 10) phone = '91' + phone;
      const waUrl = phone ? `https://wa.me/${phone}?text=${encodeURIComponent(textMsg)}` : `https://api.whatsapp.com/send?text=${encodeURIComponent(textMsg)}`;
      window.open(waUrl, '_blank', 'noopener,noreferrer');
      const url = URL.createObjectURL(reminderFile);
      const link = document.createElement('a'); link.href = url; link.download = reminderFile.name; document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url);
      showFeedback('EMI reminder image saved and WhatsApp opened');
    } catch (err) {
      if (err && err.name === 'AbortError') { showFeedback('Reminder share canceled'); return; }
      console.error('Loan reminder share error:', err);
      showFeedback('Reminder failed: ' + (err?.message || 'image generation failed'));
    }
  };'''
          text, n = loan_old.subn(loan_new, text, count=1)
          if n != 1:
              raise SystemExit('Loan WhatsApp handler not found')

          # 5) Export rendering: apply centering/aspect-ratio rules globally to hidden export slips.
          css = '''\nconst EXPORT_SLIP_CSS = `\n  .canvas-hide table { border-collapse: collapse !important; }\n  .canvas-hide th, .canvas-hide td { vertical-align: middle !important; }\n  .canvas-hide td, .canvas-hide th { padding-top: 4px !important; padding-bottom: 4px !important; }\n  .canvas-hide img { height: auto !important; max-height: none !important; object-fit: contain !important; }\n`;\n\n'''
          if 'const EXPORT_SLIP_CSS = `' not in text:
              marker = 'const AppContext = createContext();'
              if marker not in text: raise SystemExit('AppContext marker not found')
              text = text.replace(marker, css + marker, 1)

          # Make all export portals receive the CSS, regardless of their exact root class.
          if 'EXPORT_SLIP_CSS' in text and '<style>{EXPORT_SLIP_CSS}</style>' not in text:
              text = text.replace('<div className="canvas-hide">', '<div className="canvas-hide"><style>{EXPORT_SLIP_CSS}</style>')

          text = text.replace('className="w-[104px] h-[104px] object-contain select-none"', 'className="w-[104px] h-auto object-contain select-none" style={{ height: \'auto\', maxHeight: \'104px\' }}')

          p.write_text(text, encoding='utf-8')

          checks = [
              'const LoadingScreen = () => null;',
              "setCatType(type === 'INCOME' ? 'income' : 'expense');",
              'const handleWhatsAppShare = async () => {',
              'const handleSendWhatsAppReminder = async () => {',
              'const EXPORT_SLIP_CSS = `',
              'w-[104px] h-auto object-contain select-none'
          ]
          for c in checks:
              if c not in text: raise SystemExit(f'Missing final fix: {c}')

      - name: Improve Google sign-in error and commit
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/googleSync.js')
          text = p.read_text(encoding='utf-8')
          old = """    } catch (err) {\n      throw this._normalizeError(err, 'Sign-in canceled or failed.');\n    }\n  },"""
          new = """    } catch (err) {\n      const code = String(err?.code ?? err?.statusCode ?? err?.errorCode ?? '');\n      if (code === '10' || code.toLowerCase().includes('developer')) {\n        throw new Error('Google sign-in developer configuration error (code 10). Add this APK debug SHA-1 to the Android OAuth client for com.bharatrasve.budgetbharat: 97:72:9E:58:67:70:44:4A:61:7F:65:69:42:C4:3B:21:84:DF:3E:ED, then retry.');\n      }\n      throw this._normalizeError(err, 'Sign-in canceled or failed.');\n    }\n  },"""
          if old not in text: raise SystemExit('Google login catch block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          import subprocess
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','src/main.jsx','src/googleSync.js'], check=True)
          subprocess.run(['git','commit','-m','fix: final app fixes'], check=True)

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/apply-share-export-fixes.yml
          git commit -m "chore: remove temporary final-fix workflow"
          git push
