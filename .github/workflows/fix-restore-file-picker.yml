name: Fix Drive CSV restore picker

on:
  push:
    branches:
      - fix/native-exports-backup-sync-ci

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: enable Drive CSV restore picker'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch restore file picker
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/main.jsx')
          text = path.read_text(encoding='utf-8')

          old_accept = 'accept=".csv,text/csv"'
          if old_accept not in text:
              raise SystemExit('Expected CSV file input accept attribute was not found.')
          text = text.replace(old_accept, 'accept="*/*"', 1)

          old_handler = """                  const file = e.target.files && e.target.files[0];
                  e.target.value = '';
                  if (!file) return;
                  if (!window.confirm('Restoring a backup replaces all current data on this device. Continue?')) return;
                  setIsMenuOpen(false);
                  importFullBackupCsv(file);"""
          new_handler = """                  const file = e.target.files && e.target.files[0];
                  e.target.value = '';
                  if (!file) return;
                  const fileName = String(file.name || '').toLowerCase();
                  const fileType = String(file.type || '').toLowerCase();
                  if (!fileName.endsWith('.csv') && fileType !== 'text/csv' && fileType !== 'application/csv') {
                    showFeedback('Please select a Budget Bharat CSV backup file.');
                    return;
                  }
                  if (!window.confirm('Restoring a backup replaces all current data on this device. Continue?')) return;
                  setIsMenuOpen(false);
                  importFullBackupCsv(file);"""
          if old_handler not in text:
              raise SystemExit('Expected restore file input handler was not found.')
          text = text.replace(old_handler, new_handler, 1)

          path.write_text(text, encoding='utf-8')

          import subprocess
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'src/main.jsx'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--quiet'], check=False)
          result = subprocess.run(['git', 'diff', '--cached', '--quiet'])
          if result.returncode == 0:
              print('Restore picker already fixed.')
          else:
              subprocess.run(['git', 'commit', '-m', 'fix: enable Drive CSV restore picker'], check=True)
              subprocess.run(['git', 'push'], check=True)
